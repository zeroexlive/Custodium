name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run python manage.py check --settings=config.settings.testing
      - run: uv run pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Rust MPC crates exist as a fail-closed skeleton. Their tests are written
  # but the job is informational until Phase 3 integrates real threshold
  # libraries; it must not be treated as a security review.
  mpc-skeleton:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mpc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
