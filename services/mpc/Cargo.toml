# Custodium MPC workspace.
# Phase 3 added the test-only evaluation harness
# (crates/eval_harness), which pins the candidate libraries and
# evaluated them with ephemeral in-memory keys.
# Post-roadmap (2026-11-13, at William's direction) the production
# signer implementation lives in crates/signer_service: real
# threshold ceremonies over a peer transport with encrypted share
# storage, built so the independent review has an implementation to
# review. It is NOT activated: the Django wiring keeps the
# fail-closed signers unless an explicit default-off gate is opened,
# and Custodium remains NOT Security Reviewed / NOT Production
# Approved until the review in docs/mpc/review/ passes. See
# docs/architecture/production-signer.md.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.74"

[workspace.dependencies]
# Internal crates (path only).
custodium-mpc-shared = { path = "crates/shared" }

# --- External threshold-cryptography libraries ---
# Phase 3 (2026-11-12) pinned, inside the evaluation harness:
#   cggmp24 = "=0.7.0-alpha.2"   (CGGMP family, threshold ECDSA;
#     cggmp21 was rejected — see docs/mpc/phase-3-evaluation.md §CVE)
#   frost-ed25519 = "=3.0.0"      (FROST, RFC 9591, Ed25519)
# crates/signer_service uses the same pins for the production
# signer implementation (built 2026-11-13 at William's direction so
# the implementation can be reviewed; activation remains gated on
# the independent review — docs/mpc/review/).
# tonic / prost (gRPC stack) are likewise deferred until the proto
# codegen approach is reviewed; the .proto contract lives in
# ../../packages/proto.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "abort"
