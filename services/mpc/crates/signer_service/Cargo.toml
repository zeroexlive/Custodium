[package]
name = "custodium-signer-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Custodium production MPC signer service: one binary per threshold participant node (cggmp24 ECDSA + FROST Ed25519), encrypted share storage, peer-to-peer protocol transport over HTTP, coordinator client API. Ships DISABLED in the Django wiring until the independent cryptographic review passes — see docs/architecture/production-signer.md."

[[bin]]
name = "custodium-signer"
path = "src/main.rs"

[dependencies]
# Threshold cryptography — the exact Phase 3 pins (the lockfile is
# part of the pin). cggmp24 is ALPHA and NOT independently reviewed
# for Custodium; cggmp21 is rejected at any version (CVE-2025-66016,
# RUSTSEC-2025-0127). See docs/mpc/phase-3-evaluation.md.
cggmp24 = { version = "=0.7.0-alpha.2", features = ["curve-secp256k1"] }
cggmp24-keygen = "=0.7.0-alpha.2"
paillier-zk = "=0.7.0-alpha.2"
fast-paillier = { version = "0.3", features = ["backend-rug"] }
frost-ed25519 = { version = "=3.0.0", features = ["serde"] }
round-based = "=0.4.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
futures-util = "0.3"
tokio-stream = "0.1"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
generic-ec = "0.4"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
# Independent verifiers for the service tests (same approach as the
# Phase 3 evaluation harness): k256 for ECDSA, ed25519-zebra for
# Ed25519, sha3 for the EVM ecrecover cross-check.
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-zebra = "4"
sha3 = "0.10"

[lints]
workspace = true
