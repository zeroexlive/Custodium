# Custodium on S1: dashboard static build + API reverse proxy.
# Terminate TLS here (Let's Encrypt / your CA). Only 443 (and the
# 80 -> 443 redirect) is public; the API listens on loopback.
server {
    listen 80;
    server_name app.example.com api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com api.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers (the production Django settings also send
    # HSTS; keep the two consistent).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;

    root /srv/custodium/apps/dashboard/dist;
    index index.html;

    # API + health probes -> gunicorn on loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8000; }
    location = /readyz  { proxy_pass http://127.0.0.1:8000; }

    # SPA fallback for the dashboard.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
