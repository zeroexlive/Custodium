[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custodium-backend"
version = "0.1.0"
description = "Custodium — multi-chain MPC Wallet-as-a-Service backend (Django + Django Ninja)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-ninja>=1.3",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "redis>=5",
    "httpx>=0.27",
    "cryptography>=42",
    "gunicorn>=22",
    "pycryptodome>=4.4.0",
    "pyotp>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]  # generated by Django; not hand-maintained

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Ninja uses function-call defaults for auth dependencies

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []
